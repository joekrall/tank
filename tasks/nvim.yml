- name: Remove Neovim
  become: true
  ansible.builtin.file:
    path: "{{ lookup('env', 'HOME') }}/neovim"
    state: absent
  tags:
    - install
    - neovim

- name: Get Packer
  ansible.builtin.git:
    repo: 'https://github.com/wbthomason/packer.nvim'
    dest: "{{ lookup('env', 'HOME') }}/.local/share/nvim/site/pack/packer/start/packer.nvim"
  tags:
    - install
    - neovim

- name: Clone Neovim
  ansible.builtin.git:
    repo: 'https://github.com/neovim/neovim.git'
    dest: "{{ lookup('env', 'HOME') }}/neovim"
    version: stable
    update: false
  tags:
    - install
    - neovim

- name: Build Neovim
  ansible.builtin.shell:
    cmd: "make CMAKE_BUILD_TYPE=RelWithDebInfo"
    chdir: "{{ lookup('env', 'HOME') }}/neovim"
  tags:
    - install
    - neovim

- name: Install Neovim
  become: true
  ansible.builtin.shell:
    cmd: "make install"
    chdir: "{{ lookup('env', 'HOME') }}/neovim"
  tags:
    - install
    - neovim
